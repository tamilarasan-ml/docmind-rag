name: Python Checks

on:
  push:
    branches:
      - fix/citation-grounding-sync
  pull_request:
    branches:
      - fix/citation-grounding-sync

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile src/evaluate.py
          python -m py_compile src/evaluate_q19.py
          python -m py_compile scripts/run_regression.py

      - name: Check whitespace
        run: git diff --check
