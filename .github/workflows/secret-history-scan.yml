name: Secret History Scan

on:
  push:
    branches:
      - feat/docmind-live-evaluation

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan full Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history and refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pinned Gitleaks and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.24.3"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -fsSL "${BASE_URL}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep " ${ARCHIVE}$" checksums.txt | sha256sum --check -
          tar -xzf "${ARCHIVE}" gitleaks
          ./gitleaks version

      - name: Scan all available Git history
        shell: bash
        run: |
          set -euo pipefail
          ./gitleaks git --redact=100 --log-opts="--all" --exit-code 1
