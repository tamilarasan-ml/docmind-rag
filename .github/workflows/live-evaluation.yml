name: DOCMIND Live Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evaluation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full live evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_QUERY_KEY: ${{ secrets.AZURE_SEARCH_QUERY_KEY }}
          AZURE_SEARCH_INDEX_NAME: ${{ secrets.AZURE_SEARCH_INDEX_NAME }}
        run: |
          python scripts/run_regression.py

      - name: Upload validated evaluation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docmind-live-evaluation-report-${{ github.run_number }}
          path: data/eval_report.json
          if-no-files-found: error

      - name: Upload candidate report after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docmind-live-evaluation-failure-candidate-${{ github.run_number }}
          path: data/.eval_report_candidate.json
          include-hidden-files: true
          if-no-files-found: ignore
